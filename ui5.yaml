specVersion: "3.1"
metadata:
  name: zpmkanban
type: application
framework:
  name: SAPUI5
  version: "1.154.0"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.f
    - name: themelib_sap_horizon
server:
  customMiddleware:
    # sends /sap/... calls to the S/4HANA system; destination = BTP destination of the S/4HANA tenant
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        backend:
          - path: /sap
            destination: my402225
