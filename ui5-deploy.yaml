# Deploy to the ABAP repository of the S/4HANA Cloud Public Edition system (BAS: "Deploy" / fiori deploy).
specVersion: "3.1"
metadata:
  name: zpmkanban
type: application
builder:
  resources:
    excludes:
      - "/localService/**"
      - "/test/**"
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: my402225
        app:
          name: ZPM_KANBAN
          description: PM Maintenance Order Kanban
          package: ZPM_OLENEX_KANBAN_PM
          transport: ""        # empty: the deploy tool asks for one
        exclude:
          - /localService/
